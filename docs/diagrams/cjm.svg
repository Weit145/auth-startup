<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1720px;height:227px;background:#FFFFFF;" width="1720px" height="227px" viewBox="0 0 1720 227" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="685.652" y="24.966" fill="#000" font-size="14" textLength="341.697" font-weight="700">Auth — CJM: путь регистрации внутри сервиса</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0001" data-source-line="6"><rect x="58" y="52.068" width="204.869" height="96.272" fill="#E8F3FF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="68" y="77.034" fill="#000" font-size="14" textLength="64.022">1. Запрос</text><text x="68" y="96.102" fill="#000" font-size="14" textLength="184.869">Цель: начать регистрацию</text><text x="68" y="115.17" fill="#000" font-size="14" textLength="183.175">Gateway → RegisterRequest</text><text x="68" y="134.238" fill="#000" font-size="14" textLength="146.103">Создать pending user</text></g><!--entity email--><g class="entity" data-qualified-name="email" id="ent0002" data-source-line="7"><rect x="437" y="52.068" width="177.681" height="96.272" fill="#FFF2D7" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="447" y="77.034" fill="#000" font-size="14" textLength="142.351">2. Ожидание письма</text><text x="447" y="96.102" fill="#000" font-size="14" textLength="157.681">Цель: получить ссылку</text><text x="447" y="115.17" fill="#000" font-size="14" textLength="145.249">Токен + event_outbox</text><text x="447" y="134.238" fill="#000" font-size="14" textLength="129.639">Kafka → notification</text></g><!--entity confirm--><g class="entity" data-qualified-name="confirm" id="ent0003" data-source-line="8"><rect x="816.5" y="52.068" width="223.881" height="96.272" fill="#FFF2D7" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="826.5" y="77.034" fill="#000" font-size="14" textLength="125.818">3. Подтверждение</text><text x="826.5" y="96.102" fill="#000" font-size="14" textLength="203.881">Цель: доказать доступ к email</text><text x="826.5" y="115.17" fill="#000" font-size="14" textLength="186.563">ConfirmEmail(token, userID)</text><text x="826.5" y="134.238" fill="#000" font-size="14" textLength="106.316">Погасить токен</text></g><!--entity complete--><g class="entity" data-qualified-name="complete" id="ent0004" data-source-line="9"><rect x="1178.5" y="52.068" width="266.021" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1188.5" y="77.034" fill="#000" font-size="14" textLength="66.976">4. Пароль</text><text x="1188.5" y="96.102" fill="#000" font-size="14" textLength="212.519">Цель: завершить регистрацию</text><text x="1188.5" y="115.17" fill="#000" font-size="14" textLength="246.021">RegisterComplete(session, password)</text><text x="1188.5" y="134.238" fill="#000" font-size="14" textLength="158.703">Создать refresh session</text></g><!--entity access--><g class="entity" data-qualified-name="access" id="ent0005" data-source-line="10"><rect x="1503" y="52.068" width="200.809" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1513" y="77.034" fill="#000" font-size="14" textLength="62.804">5. Доступ</text><text x="1513" y="96.102" fill="#000" font-size="14" textLength="180.809">Цель: вернуться в аккаунт</text><text x="1513" y="115.17" fill="#000" font-size="14" textLength="158.703">Login / Refresh / Logout</text><text x="1513" y="134.238" fill="#000" font-size="14" textLength="130.493">Управлять сессией</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="18"><path d="M6,166.568 L6,211.98 A0,0 0 0 0 6,211.98 L315.197,211.98 A0,0 0 0 0 315.197,211.98 L315.197,176.568 L305.197,166.568 L164.5,166.568 L160.5,148.313 L156.5,166.568 L6,166.568 A0,0 0 0 0 6,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M305.197,166.568 L305.197,176.568 L315.197,176.568 L305.197,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="185.465" fill="#000" font-size="13" textLength="264.108">Результат: users, email_verification_tokens</text><text x="12" y="203.171" fill="#000" font-size="13" textLength="288.197">и event_outbox созданы в одной транзакции.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="22"><path d="M351,166.568 L351,211.98 A0,0 0 0 0 351,211.98 L701.29,211.98 A0,0 0 0 0 701.29,211.98 L701.29,176.568 L691.29,166.568 L530,166.568 L526,148.313 L522,166.568 L351,166.568 A0,0 0 0 0 351,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M691.29,166.568 L691.29,176.568 L701.29,176.568 L691.29,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="357" y="185.465" fill="#000" font-size="13" textLength="329.29">Сложность: задержка или истечение срока письма.</text><text x="357" y="203.171" fill="#000" font-size="13" textLength="207.376">Повторный запрос: RepeatEmail.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="26"><path d="M737,166.568 L737,211.98 A0,0 0 0 0 737,211.98 L1120.037,211.98 A0,0 0 0 0 1120.037,211.98 L1120.037,176.568 L1110.037,166.568 L932.5,166.568 L928.5,148.313 L924.5,166.568 L737,166.568 A0,0 0 0 0 737,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1110.037,166.568 L1110.037,176.568 L1120.037,176.568 L1110.037,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="743" y="185.465" fill="#000" font-size="13" textLength="318.539">Результат: registration_sessions и временный JWT.</text><text x="743" y="203.171" fill="#000" font-size="13" textLength="362.037">Использование ограничено завершением регистрации.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="30"><path d="M1156,166.068 L1156,193.774 A0,0 0 0 0 1156,193.774 L1467.121,193.774 A0,0 0 0 0 1467.121,193.774 L1467.121,176.068 L1457.121,166.068 L1315.5,166.068 L1311.5,148.233 L1307.5,166.068 L1156,166.068 A0,0 0 0 0 1156,166.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1457.121,166.068 L1457.121,176.068 L1467.121,176.068 L1457.121,166.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1162" y="184.965" fill="#000" font-size="13" textLength="290.121">Результат: пароль, access JWT и refresh token.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="436.873,100.068,427.873,96.068,431.873,100.068,427.873,104.068,436.873,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M263.238,100.068 C317.847,100.068 379.495,100.068 431.873,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="816.413,100.068,807.413,96.068,811.413,100.068,807.413,104.068,816.413,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M615.387,100.068 C674.589,100.068 747.997,100.068 811.413,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="1178.256,100.068,1169.256,96.068,1173.256,100.068,1169.256,104.068,1178.256,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1040.725,100.068 C1083.775,100.068 1128.399,100.068 1173.256,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="e